apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

configMapGenerator:
  - name: zgate-relay-policy
    files:
      - policy.yaml
    options:
      labels:
        app.kubernetes.io/name: zgate-relay
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: zgate
