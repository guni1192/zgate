apiVersion: apps/v1
kind: Deployment
metadata:
  name: zgate-relay
  labels:
    app.kubernetes.io/name: zgate-relay
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: zgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zgate-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zgate-relay
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: zgate
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: sysctl
          image: busybox:1.37
          command: ["sh", "-c", "sysctl -w net.ipv4.ip_forward=1"]
          securityContext:
            privileged: true
      containers:
        - name: relay
          image: ghcr.io/guni1192/zgate-relay
          ports:
            - name: masque
              containerPort: 4433
              protocol: UDP
            - name: health
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: zgate-relay-env
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            - name: policy
              mountPath: /etc/zgate
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
      volumes:
        - name: tls-certs
          secret:
            secretName: zgate-relay-tls
        - name: policy
          configMap:
            name: zgate-relay-policy
