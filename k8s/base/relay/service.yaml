apiVersion: v1
kind: Service
metadata:
  name: zgate-relay
  labels:
    app.kubernetes.io/name: zgate-relay
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: zgate
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app.kubernetes.io/name: zgate-relay
  ports:
    - name: masque
      port: 4433
      targetPort: masque
      protocol: UDP
