apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zgate-dev

resources:
  - ../../base/relay

images:
  - name: ghcr.io/guni1192/zgate-relay
    newTag: latest

configMapGenerator:
  - name: zgate-relay-policy
    behavior: replace
    files:
      - policy.yaml
    options:
      labels:
        app.kubernetes.io/name: zgate-relay
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: zgate
